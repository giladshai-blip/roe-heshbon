name: Apply Core V5.9 migration

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/apply-core-v59b.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply migration
        run: python tools/apply_core_v59.py
      - name: Static checks
        run: |
          cp src/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Code.gs
          git commit -m 'Core V5.9 migrate planned reconciliation into Core'
          git push origin HEAD:dev
