name: security-audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - dev-1.10.0-security-hardening
      - main

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run security audit
        run: bash scripts/security-audit.sh
