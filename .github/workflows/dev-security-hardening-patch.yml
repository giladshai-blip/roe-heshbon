name: dev-security-hardening-patch

on:
  push:
    branches:
      - dev-1.10.0-security-hardening
    paths:
      - '.github/workflows/dev-security-hardening-patch.yml'

permissions:
  contents: write

jobs:
  patch-core:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-1.10.0-security-hardening
      - name: Patch Apps Script security controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Code.gs')
          text = path.read_text(encoding='utf-8')
          original = text

          def must_replace(src, old, new, label):
              if old not in src:
                  raise SystemExit(f'missing expected pattern: {label}')
              return src.replace(old, new, 1)

          # Stop persisting RiseUp token-reference metadata in future sync rows.
          text = must_replace(
              text,
              "'מצב סנכרון','X-Riseup-Token-Ref','משך_ms','חדשות','עודכנו','כפילויות',",
              "'מצב סנכרון','משך_ms','חדשות','עודכנו','כפילויות',",
              'sync log token-ref header'
          )
          text = must_replace(text, "tokenRef:'',", "", 'metrics tokenRef')
          text = must_replace(text, "if(r&&r._meta&&r._meta.tokenRef)metrics.tokenRef=r._meta.tokenRef;", "", 'transaction tokenRef capture')
          text = must_replace(text, "if(budget&&budget._meta&&budget._meta.tokenRef)metrics.tokenRef=budget._meta.tokenRef;", "", 'budget tokenRef capture')
          text = must_replace(text, ",tokenRef:metrics.tokenRef,", ",", 'sync log tokenRef value')
          text = must_replace(text, "x.syncState||'',x.tokenRef||'',x.durationMs||''", "x.syncState||'',x.durationMs||''", 'log value alignment')

          # Harden only the external transaction normalization surface.
          start = text.index('function normalizeTransaction_(tx,now)')
          end = text.index('function transactionFingerprintFromRow_', start)
          block = text[start:end]
          replacements = [
              ("tx.transactionId||tx.id||''", "sheetSafeText_(tx.transactionId||tx.id||'')"),
              ("tx.businessName||tx.description||''", "sheetSafeText_(tx.businessName||tx.description||'')"),
              ("tx.categoryLabel||tx.category||''", "sheetSafeText_(tx.categoryLabel||tx.category||'')"),
              ("tx.sourceType||tx.accountType||''", "sheetSafeText_(tx.sourceType||tx.accountType||'')"),
              ("tx.source||''", "sheetSafeText_(tx.source||'')"),
              ("tx.accountNickname||tx.accountName||''", "sheetSafeText_(tx.accountNickname||tx.accountName||'')"),
              ("tx.accountNumberHash||''", "sheetSafeText_(tx.accountNumberHash||'')"),
              ("tx.installmentNumber||''", "sheetSafeText_(tx.installmentNumber||'')"),
              ("tx.commitmentId||''", "sheetSafeText_(tx.commitmentId||'')"),
              ("tx.actualType||''", "sheetSafeText_(tx.actualType||'')"),
              ("tx.categoryType||''", "sheetSafeText_(tx.categoryType||'')"),
          ]
          for old, new in replacements:
              if old not in block:
                  raise SystemExit(f'missing normalizeTransaction pattern: {old}')
              block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]

          # Harden externally supplied budget identity/type strings.
          start = text.index('function syncBudget_(month,response)')
          end = text.index('function riseupGet_', start)
          block = text[start:end]
          for old, new in [
              ("env.id||env.envelopeId||''", "sheetSafeText_(env.id||env.envelopeId||'')"),
              ("env.type||env.name||''", "sheetSafeText_(env.type||env.name||'')"),
          ]:
              if old not in block:
                  raise SystemExit(f'missing syncBudget pattern: {old}')
              block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]

          # Pin outbound RiseUp calls to the expected relative API namespace.
          marker = "function riseupGet_(path,pat){"
          replacement = "function riseupGet_(path,pat){if(typeof path!=='string'||!path.startsWith('/api/external/')||path.includes('://')||path.includes('\\\\'))throw new Error('RiseUp path אינו מורשה');"
          text = must_replace(text, marker, replacement, 'RiseUp path guard')

          # Add a sheet-safe text helper. Leading formula-control characters are escaped
          # with an apostrophe before setValues() can interpret them as formulas.
          helper_anchor = "function numberOrNaN_(value){"
          helper = "function sheetSafeText_(value){const s=String(value??'');return /^[=+\\-@]/.test(s)?\"'\"+s:s;}\n"
          if helper not in text:
              text = must_replace(text, helper_anchor, helper + helper_anchor, 'sheetSafeText helper')

          if text == original:
              raise SystemExit('security patch made no changes')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patched invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "function sheetSafeText_(value)" src/Code.gs
          grep -F "RiseUp path אינו מורשה" src/Code.gs
          if grep -F "X-Riseup-Token-Ref" src/Code.gs; then
            echo "token reference header still present" >&2
            exit 1
          fi
          if grep -F "tokenRef:metrics.tokenRef" src/Code.gs; then
            echo "token reference still logged" >&2
            exit 1
          fi

      - name: Commit security patch to DEV branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Code.gs
          git diff --cached --quiet && exit 0
          git commit -m "dev: harden external data ingestion"
          git push origin HEAD:dev-1.10.0-security-hardening
