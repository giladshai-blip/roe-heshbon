name: Apply Core V5.9 reconciliation migration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-core-v59.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply deterministic Core V5.9 migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('src/Code.gs')
          s = p.read_text()
          assert "VERSION: 'V5.8.0'" in s
          assert "DASHBOARD_VERSION: 'V5.8.0'" in s
          assert "function getFinancialSnapshotV58_()" in s
          assert "function getPlannedReconciliationV59_()" not in s
          s=s.replace('רואה חשבון — Core V5.8.0','רואה חשבון — Core V5.9.0',1)
          s=s.replace('עיקרי V5.8.0:','עיקרי V5.9.0:',1)
          s=s.replace(" * - Dashboard צורך את מנוע ה-Core ואינו מחשב מחדש KPI קריטיים.\n * - בדיקות Runtime מובנות למבנה, כפילויות, עסקאות, תחזית ו-KPI."," * - Dashboard צורך את מנוע ה-Core ואינו מחשב מחדש KPI קריטיים.\n * - מנגנון התאמת תזרים מתוכנן ↔ תנועות עבר ל-Core עם סינון סטטוס מדויק.\n * - שלב Cutover בטוח: מנוע ההתאמה ב-Core הוא קריאה בלבד ואינו דורס נוסחאות K–M.\n * - בדיקות Runtime מובנות למבנה, כפילויות, עסקאות, תחזית, התאמות ו-KPI.",1)
          s=s.replace("  VERSION: 'V5.8.0',\n  DASHBOARD_VERSION: 'V5.8.0',","  VERSION: 'V5.9.0',\n  DASHBOARD_VERSION: 'V5.8.0',",1)
          s=s.replace("  INITIAL_RETRY_MS: 1000,","  INITIAL_RETRY_MS: 1000,\n  RECONCILIATION_WINDOW_DAYS: 3,\n  RECONCILIATION_AMOUNT_TOLERANCE: 1,",1)
          s=s.replace("function setupV58() { return setupV56(); }","function setupV59() { return setupV56(); }\nfunction setupV58() { return setupV56(); }",1)
          s=s.replace("const metrics={inserted:0,updated:0,unchanged:0,duplicates:0,months:[],tokenRef:'',riseupLastUpdatedAt:'',budgetUpdated:false,balanceBefore:'',balanceAfter:''};","const metrics={inserted:0,updated:0,unchanged:0,duplicates:0,months:[],tokenRef:'',riseupLastUpdatedAt:'',budgetUpdated:false,balanceBefore:'',balanceAfter:'',reconciliation:null};",1)
          old="applyModelIntegrityFixes_();ensureAutomaticBankBalanceFormula_();refreshDuplicateFormulas_();SpreadsheetApp.flush();\n    if (typeof refreshDashboardForecastKpiV56 === 'function') refreshDashboardForecastKpiV56();"
          new="applyModelIntegrityFixes_();ensureAutomaticBankBalanceFormula_();refreshDuplicateFormulas_();SpreadsheetApp.flush();\n    metrics.reconciliation=getPlannedReconciliationV59_();\n    if (typeof refreshDashboardForecastKpiV56 === 'function') refreshDashboardForecastKpiV56();"
          assert old in s
          s=s.replace(old,new,1)
          old="message:'חודשים: '+metrics.months.join(', ')+' | חדשות: '+metrics.inserted+' | עודכנו: '+metrics.updated+' | ללא שינוי: '+metrics.unchanged+' | כפילויות API: '+metrics.duplicates"
          new="message:'חודשים: '+metrics.months.join(', ')+' | חדשות: '+metrics.inserted+' | עודכנו: '+metrics.updated+' | ללא שינוי: '+metrics.unchanged+' | כפילויות API: '+metrics.duplicates+' | תכנון נסרק: '+metrics.reconciliation.eligible+' | התאמות בטוחות: '+metrics.reconciliation.matched+' | לבדיקה: '+metrics.reconciliation.review"
          assert old in s
          s=s.replace(old,new,1)
          old="  test('כיסוי תחזית 30 יום',function(){const m=getForecast30DayMetrics_();if(m.covered!==30)throw new Error('כיסוי '+m.covered+'/30');return 'שפל '+formatMoney_(m.minimum)+' בתאריך '+m.minimumDate;});\n  test('עקביות KPI'"
          new="  test('כיסוי תחזית 30 יום',function(){const m=getForecast30DayMetrics_();if(m.covered!==30)throw new Error('כיסוי '+m.covered+'/30');return 'שפל '+formatMoney_(m.minimum)+' בתאריך '+m.minimumDate;});\n  test('התאמת תזרים מתוכנן',function(){const r=getPlannedReconciliationV59_();return 'זכאים '+r.eligible+' | התאמות בטוחות '+r.matched+' | לבדיקה '+r.review;});\n  test('עקביות KPI'"
          assert old in s
          s=s.replace(old,new,1)
          old="  const dash=getSheet_('DASHBOARD');[['Z2',autoBalance],['Z3',end.value],['Z4',horizon.minimum],['Z6',goal]].forEach(function(pair){const actual=numberOrNaN_(dash.getRange(pair[0]).getValue());if(!isFinite(actual)||!isFinite(pair[1])||Math.abs(actual-pair[1])>0.01)errors.push('מקור KPI בדשבורד דורש רענון: '+pair[0]);});if(!String(dash.getRange('A5').getValue()).includes('מחושבת'))warnings.push('כרטיס העו״ש אינו מסומן כמחושב');\n  const errorCells=findFormulaErrors_();"
          new="  const dash=getSheet_('DASHBOARD');[['Z2',autoBalance],['Z3',end.value],['Z4',horizon.minimum],['Z6',goal]].forEach(function(pair){const actual=numberOrNaN_(dash.getRange(pair[0]).getValue());if(!isFinite(actual)||!isFinite(pair[1])||Math.abs(actual-pair[1])>0.01)errors.push('מקור KPI בדשבורד דורש רענון: '+pair[0]);});if(!String(dash.getRange('A5').getValue()).includes('מחושבת'))warnings.push('כרטיס העו״ש אינו מסומן כמחושב');\n  const reconciliation=getPlannedReconciliationV59_();if(reconciliation.review)warnings.push(reconciliation.review+' אירועי תזרים מתוכנן דורשים בדיקת התאמה ידנית');if(reconciliation.formulaDisagreements)warnings.push(reconciliation.formulaDisagreements+' פערים בין מנוע התאמות Core לנוסחאות K–M בשלב ה-Cutover');\n  const errorCells=findFormulaErrors_();"
          assert old in s
          s=s.replace(old,new,1)
          marker='function auditTransactions_(rows){'
          assert marker in s
          funcs=base64.b64decode('').decode()
          s=s.replace(marker,funcs+marker,1)
          assert '27300' not in s and '27,300' not in s
          assert '/בוצע|מאומת/' not in s
          p.write_text(s)
          PY
          cp src/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git diff --check
      - name: Commit Core V5.9
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Code.gs
          git commit -m 'Core V5.9 migrate planned reconciliation into Core'
          git push origin HEAD:dev
