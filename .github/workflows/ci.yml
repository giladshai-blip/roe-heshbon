name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check src/Code.gs and src/Dashboard.gs
        run: node scripts/check-gs-syntax.js
      - name: Version sync (README vs Code.gs vs Dashboard.gs)
        run: node scripts/check-version-sync.js
