name: Verify canonical Apps Script

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic tests
        run: node --test tests/core.test.cjs
      - name: Syntax check Core
        run: node --check <(cat src/Code.gs)
        shell: bash
      - name: Syntax check Dashboard
        run: node --check <(cat src/Dashboard.gs)
        shell: bash
